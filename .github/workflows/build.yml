name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fix Ghidorah Pair error
        run: |
          F=src/main/java/com/kaiju/entity/GhidorahEntity.java
          sed -i 's/Pair<BlockPos, ?> r = /var r = /' $F
          sed -i '/import net.minecraft.util.Pair;/d' $F
          grep -n "locateBiome" $F
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kaiju-mod
          path: build/libs/*.jar
